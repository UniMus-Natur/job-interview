[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dwc-etl"
version = "1.0.0"
description = "Transform raw species observation records into Darwin Core occurrences"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []          # standard library only

[project.scripts]
dwc-etl = "dwc_etl.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
